name: Muses
options:
  bundleIdPrefix: com.xiaotwu.muses
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: "minimal"
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  MusesDomain:
    path: Packages/MusesDomain
  MusesQueue:
    path: Packages/MusesQueue
  MusesPersistence:
    path: Packages/MusesPersistence
  MusesNetworking:
    path: Packages/MusesNetworking
  MusesCatalog:
    path: Packages/MusesCatalog
  MusesIOSOAuth:
    path: Platform/iOS/OAuth

targets:
  Muses:
    type: application
    platform: iOS
    sources:
      # Exact old models + read-only snapshot reader share the historical Muses module.
      # No inherited networking, playback, or application services are linked.
      - path: Sources/Muses/App/PublicYouTubeApp.swift
      - path: Sources/Muses/App/PublicCredentialDeletion.swift
      - path: Sources/Muses/App/PublicWebsiteDataDeletion.swift
      - path: Sources/Muses/Features/Public/PublicMigrationArchiveView.swift
      - path: Sources/Muses/App/PublicStoreLocation.swift
      - path: Sources/Muses/Domain/Track.swift
      - path: Sources/Muses/Domain/QueueState.swift
      - path: Sources/Muses/Domain/Playlist.swift
      - path: Sources/Muses/Domain/PlaylistItem.swift
      - path: Sources/Muses/Domain/YouTubeImport.swift
      - path: Sources/Muses/Domain/YouTubeImportItem.swift
      - path: Sources/Muses/Domain/NotesModels.swift
      - path: Sources/Muses/Domain/ListeningEvent.swift
      - path: Sources/Muses/Domain/ListeningSession.swift
      - path: Sources/Muses/Domain/InboxItem.swift
      - path: Sources/Muses/Domain/EQPreset.swift
      - path: Sources/Muses/Domain/AutomationRule.swift
      - path: Sources/Muses/Domain/FocusSession.swift
      - path: Sources/Muses/Domain/YouTubeCatalog.swift
      - path: Sources/Muses/Domain/YouTubePlaylistSync.swift
      - path: Sources/Muses/Domain/Enums.swift
      - path: Sources/Muses/Domain/QueueItem.swift
      - path: Sources/Muses/Domain/QueueGroup.swift
      - path: Sources/Muses/Domain/ListeningContext.swift
      - path: Sources/Muses/Domain/EQBand.swift
      - path: Sources/Muses/Domain/RecapRange.swift
      - path: Sources/Muses/Domain/Pagination.swift
      - path: Sources/Muses/Domain/UserPreferences.swift
      - path: Sources/Muses/App/L10n.swift
      - path: Sources/Muses/Persistence/MusesSchema.swift
      - path: Sources/Muses/Persistence/LegacyMigration
      - path: Sources/Muses/Features/Public/PublicRootView.swift
      - path: Sources/Muses/Features/Public/PublicNotebookModel.swift
      - path: Sources/Muses/Features/Public/PublicNotebookViews.swift
      - path: Sources/Muses/Features/Public/PublicKeyboardDismissal.swift
      - path: Sources/Muses/Features/Public/PublicServiceLinks.swift
      - path: Sources/Muses/Features/Public/PublicPrivacyView.swift
      - path: Sources/Muses/Resources/PublicPrivacyPolicy.md
        buildPhase: resources
      - path: Sources/Muses/Features/Public/PublicCatalogViews.swift
      - path: Sources/Muses/Features/Public/PublicLibraryHeroViews.swift
      - path: Sources/Muses/Features/Public/PublicPlaylistImportView.swift
      # Compile-time DEBUG only; activated exclusively by isolated UI fixtures.
      - path: Tests/Support/PublicCatalogFixtureTransport.swift
      - path: Sources/Muses/Platform/iOS/YouTubeIFrame/YouTubeIFrameAdapter.swift
      - path: Sources/Muses/Platform/iOS/YouTubeIFrame/YouTubeIFrameContract.swift
      - path: Sources/Muses/Platform/iOS/YouTubeIFrame/YouTubeIFrameDemoViewController.swift
      - path: Sources/Muses/Resources/Assets.xcassets
      - path: Sources/Muses/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MusesDomain
      - package: MusesQueue
      - package: MusesPersistence
      - package: MusesNetworking
      - package: MusesCatalog
      - package: MusesIOSOAuth
    settings:
      base:
        INFOPLIST_FILE: Sources/Muses/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaotwu.muses.erato
        PRODUCT_NAME: Muses
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MUSES_GOOGLE_REDIRECT_SCHEME: muses-erato

  MusesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MusesTests/PublicYouTubeFlowTests.swift
      - path: Tests/MusesTests/PublicNotebookTests.swift
      - path: Tests/MusesTests/PublicPlaylistImportTests.swift
      - path: Tests/MusesTests/PublicUpgradeStartupTests.swift
      - path: Tests/LegacyMigrationTests/PhysicalLegacyFixture.swift
    dependencies:
      - target: Muses
    settings:
      base:
        PRODUCT_NAME: MusesTests
        PRODUCT_MODULE_NAME: MusesTests
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaotwu.muses.erato.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Muses.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Muses"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  MusesPublicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/MusesPublicUITests
    dependencies:
      - target: Muses
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaotwu.muses.erato.publicuitests
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

schemes:
  Muses:
    build:
      targets:
        Muses: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MusesTests
        - MusesPublicUITests
