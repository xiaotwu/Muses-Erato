# App Store / TestFlight composition. Generate into .artifacts/public-project.
include:
  - project.yml
name: MusesPublic
packages:REPLACE:
  MusesDomain:
    path: Packages/MusesDomain
  MusesQueue:
    path: Packages/MusesQueue
  MusesPersistence:
    path: Packages/MusesPersistence
  MusesNetworking:
    path: Packages/MusesNetworking
  MusesCatalog:
    path: Packages/MusesCatalog
  MusesIOSOAuth:
    path: Platform/iOS/OAuth
targets:
  Muses:
    dependencies:REPLACE:
      - package: MusesDomain
      - package: MusesQueue
      - package: MusesPersistence
      - package: MusesNetworking
      - package: MusesCatalog
      - package: MusesIOSOAuth
    settings:
      base:
        INFOPLIST_FILE: "$(PROJECT_DIR)/../../Sources/Muses/Resources/Info.plist"
      configs:REPLACE:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        Native:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"

  # Public tests exercise the disabled native stub; engine tests belong to MusesNative.
  MusesTests:
    sources:
      - path: Tests/MusesTests/PublicPlaybackCapabilityTests.swift

  MusesPublicUITests:
    sources:REPLACE:
      - path: Tests/MusesPublicUITests
        excludes:
          - PublicNativePlayerUITests.swift

# Replace inherited schemes so Public never offers Native or live diagnostics.
schemes:REPLACE:
  MusesPublic:
    build:
      targets:
        Muses: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MusesTests
        - name: MusesPublicUITests
          skippedTests:
            - PublicIPadLayoutUITests
            - PublicIPadAccessibilityAuditUITests
    archive:
      config: Release
  # Compatibility for documented release commands; identical Public composition.
  Muses:
    build:
      targets:
        Muses: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MusesTests
        - name: MusesPublicUITests
          skippedTests:
            - PublicIPadLayoutUITests
            - PublicIPadAccessibilityAuditUITests
    archive:
      config: Release
  MusesPublicIPad:
    build:
      targets:
        Muses: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: MusesPublicUITests
          selectedTests:
            - PublicIPadLayoutUITests
    archive:
      config: Release
  # Strict raw system audit is an explicit diagnostic lane; retain all findings.
  MusesPublicAccessibilityAudit:
    build:
      targets:
        Muses: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: MusesPublicUITests
          selectedTests:
            - PublicIPadAccessibilityAuditUITests
    archive:
      config: Release
